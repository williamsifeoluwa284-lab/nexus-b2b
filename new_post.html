{% extends "base.html" %}
{% block title %}New Transmission // NEXUS{% endblock %}
{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <h2>NEW TRANSMISSION</h2>
    <form method="POST">
        <label>TITLE</label>
        <input type="text" name="title" required>
        <label>CATEGORY</label>
        <select name="category">
            <option>General</option>
            <option>Partnerships</option>
            <option>Deals</option>
            <option>Tech</option>
            <option>Investment</option>
        </select>
        <label>CONTENT</label>
        <textarea name="content" rows="8" required></textarea>
        <label>ATTACHMENT (optional — images, PDF, docs)</label>
        <input type="file" name="attachment" accept=".png,.jpg,.jpeg,.gif,.pdf,.txt,.doc,.docx">
        <button type="submit">BROADCAST</button>
    </form>
</div>
{% endblock %}
