{% extends "base.html" %}
{% block title %}Initialize Account // NEXUS{% endblock %}
{% block content %}
<div class="card" style="max-width: 480px; margin: 3rem auto;">
    <h2 style="text-align: center;">INITIALIZE ACCOUNT</h2>
    <form method="POST">
        <label>USERNAME</label>
        <input type="text" name="username" required>
        <label>EMAIL</label>
        <input type="email" name="email" required>
        <label>PASSWORD</label>
        <input type="password" name="password" required>
        <label>COMPANY (optional)</label>
        <input type="text" name="company">
        <button type="submit" style="width: 100%; margin-top: 0.5rem;">CREATE OPERATOR</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem;">
        Already registered? <a href="{{ url_for('auth.login') }}">Authenticate</a>
    </p>
</div>
{% endblock %}
