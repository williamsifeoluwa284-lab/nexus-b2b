{% extends "base.html" %}
{% block title %}Authenticate // NEXUS{% endblock %}
{% block content %}
<div class="card" style="max-width: 480px; margin: 3rem auto;">
    <h2 style="text-align: center;">AUTHENTICATE</h2>
    <form method="POST">
        <label>USERNAME</label>
        <input type="text" name="username" required autofocus>
        <label>PASSWORD</label>
        <input type="password" name="password" required>
        <button type="submit" style="width: 100%; margin-top: 0.5rem;">ACCESS GRID</button>
    </form>
    <p style="text-align: center; margin-top: 1.5rem;">
        No account? <a href="{{ url_for('auth.register') }}">Initialize one</a>
    </p>
</div>
{% endblock %}
